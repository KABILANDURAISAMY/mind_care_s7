services:
  # =======================================================
  # MindCare Backend — Node.js Web Service
  # =======================================================
  - type: web
    name: mindcare-api
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Render auto-assigns PORT — do NOT set it manually
      # MongoDB Atlas connection string (set in Render dashboard)
      - key: MONGO_URI
        sync: false
      # JWT signing secret (set in Render dashboard)
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      # Frontend URL for CORS (set after frontend deploys, e.g. https://mindcare-frontend.onrender.com)
      - key: CLIENT_URL
        sync: false

  # =======================================================
  # MindCare Frontend — React Static Site
  # =======================================================
  - type: web
    name: mindcare-frontend
    env: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Backend API URL (set after backend deploys, e.g. https://mindcare-api.onrender.com/api)
      - key: VITE_API_URL
        sync: false
